name: Update careers data

on:
  schedule:
    - cron: "0 11 * * 1" # Mondays ~6am ET
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull and classify listings
        run: python scripts/update_jobs.py
      - name: Commit refreshed data
        run: |
          git config user.name "battle-pass-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json data/companies.json
          if git diff --cached --quiet; then
            echo "No changes this week."
          else
            git commit -m "Weekly careers data refresh"
            git push
          fi
