<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSBE Battle Pass - Admin Dashboard</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .data-table {
            border-collapse: collapse;
            width: 100%;
        }
        .data-table th, .data-table td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #374151;
        }
        .data-table th {
            background-color: #1f2937;
            position: sticky;
            top: 0;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div id="admin-dashboard"></div>

    <script src="src/LocalDataManager.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function AdminDashboard() {
            const [members, setMembers] = useState([]);
            const [paidMembers, setPaidMembers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('overview');

            useEffect(() => {
                loadAllData();
            }, []);

            async function loadAllData() {
                try {
                    setLoading(true);
                    
                    // Load paid members list
                    const paidResponse = await fetch("data/membership/NSBEUM 25-26' Emailing List - Mailing List.csv");
                    const paidText = await paidResponse.text();
                    const paidLines = paidText.trim().split('\n');
                    const paidEmails = new Set();
                    
                    for (let i = 1; i < paidLines.length; i++) {
                        const parts = paidLines[i].split(',');
                        if (parts[1]) {
                            paidEmails.add(parts[1].toLowerCase().trim());
                        }
                    }
                    
                    console.log('✅ Loaded paid members:', paidEmails.size);
                    
                    // Load main leaderboard data
                    const leaderboardData = await window.getLocalLeaderboard();
                    const allMembers = leaderboardData.leaderboard || [];
                    
                    // Mark paid status based on paid members CSV
                    allMembers.forEach(member => {
                        member.isPaidChapter = paidEmails.has(member.email?.toLowerCase().trim());
                    });
                    
                    const paid = allMembers.filter(m => m.isPaidChapter);
                    
                    console.log('✅ Total members:', allMembers.length);
                    console.log('✅ Paid chapter members:', paid.length);
                    
                    setMembers(allMembers);
                    setPaidMembers(paid);
                    setLoading(false);
                } catch (error) {
                    console.error('Error loading data:', error);
                    setLoading(false);
                }
            }

            // Badge stats calculated against PAID CHAPTER MEMBERS only
            const badgeStats = useMemo(() => {
                if (paidMembers.length === 0) return {};
                
                const totalPaid = paidMembers.length;
                
                const badges = {
                    firstEvent: paidMembers.filter(m => m.eventCount >= 1).length,
                    socialButterfly: paidMembers.filter(m => {
                        return m.eventHistory?.filter(e => 
                            e.eventType?.toLowerCase().includes('social')
                        ).length >= 3;
                    }).length,
                    academicAce: paidMembers.filter(m => {
                        return m.eventHistory?.filter(e => 
                            e.eventType?.toLowerCase().includes('academic') || 
                            e.eventType?.toLowerCase().includes('study')
                        ).length >= 3;
                    }).length,
                    gbmWarrior: paidMembers.filter(m => {
                        return m.eventHistory?.filter(e => 
                            e.eventType?.toLowerCase() === 'gbm'
                        ).length >= 4;
                    }).length,
                    communityChampion: paidMembers.filter(m => {
                        return m.eventHistory?.filter(e => 
                            e.eventType?.toLowerCase().includes('community') || 
                            e.eventType?.toLowerCase().includes('service')
                        ).length >= 2;
                    }).length,
                    pdPro: paidMembers.filter(m => {
                        return m.eventHistory?.filter(e => 
                            e.eventType?.toLowerCase().includes('professional') || 
                            e.eventType?.toLowerCase() === 'pd'
                        ).length >= 3;
                    }).length,
                    superstar: paidMembers.filter(m => m.eventCount >= 10).length,
                    dedicated: paidMembers.filter(m => m.eventCount >= 5).length
                };
                
                return {
                    firstEvent: { count: badges.firstEvent, percent: (badges.firstEvent / totalPaid * 100).toFixed(1) },
                    socialButterfly: { count: badges.socialButterfly, percent: (badges.socialButterfly / totalPaid * 100).toFixed(1) },
                    academicAce: { count: badges.academicAce, percent: (badges.academicAce / totalPaid * 100).toFixed(1) },
                    gbmWarrior: { count: badges.gbmWarrior, percent: (badges.gbmWarrior / totalPaid * 100).toFixed(1) },
                    communityChampion: { count: badges.communityChampion, percent: (badges.communityChampion / totalPaid * 100).toFixed(1) },
                    pdPro: { count: badges.pdPro, percent: (badges.pdPro / totalPaid * 100).toFixed(1) },
                    superstar: { count: badges.superstar, percent: (badges.superstar / totalPaid * 100).toFixed(1) },
                    dedicated: { count: badges.dedicated, percent: (badges.dedicated / totalPaid * 100).toFixed(1) },
                    totalPaid
                };
            }, [paidMembers]);

            const systemStats = useMemo(() => {
                const activePaid = paidMembers.filter(m => m.eventCount >= 1);
                const highlyActivePaid = paidMembers.filter(m => m.eventCount >= 5);
                
                return {
                    totalMembers: members.length,
                    paidMembers: paidMembers.length,
                    activeMembers: activePaid.length,
                    highlyActive: highlyActivePaid.length,
                    avgEventsPerPaid: paidMembers.length > 0 
                        ? (paidMembers.reduce((sum, m) => sum + m.eventCount, 0) / paidMembers.length).toFixed(1)
                        : 0
                };
            }, [members, paidMembers]);

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-2xl">Loading dashboard...</div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-6">
                    <div className="max-w-7xl mx-auto">
                        <div className="mb-8">
                            <h1 className="text-4xl font-bold mb-2">NSBE Admin Dashboard</h1>
                            <p className="text-gray-400">Real-time member and event analytics</p>
                        </div>

                        {/* Tabs */}
                        <div className="flex gap-2 mb-6 border-b border-gray-700">
                            {['overview', 'members', 'badges'].map(tab => (
                                <button
                                    key={tab}
                                    onClick={() => setActiveTab(tab)}
                                    className={`px-6 py-3 font-medium capitalize transition-colors ${
                                        activeTab === tab 
                                            ? 'border-b-2 border-green-500 text-green-500' 
                                            : 'text-gray-400 hover:text-white'
                                    }`}
                                >
                                    {tab}
                                </button>
                            ))}
                        </div>

                        {/* Overview Tab */}
                        {activeTab === 'overview' && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                    <StatCard title="Total Members" value={systemStats.totalMembers} />
                                    <StatCard title="Paid Chapter Members" value={systemStats.paidMembers} color="green" />
                                    <StatCard title="Active Paid Members" value={systemStats.activeMembers} />
                                    <StatCard title="Avg Events (Paid)" value={systemStats.avgEventsPerPaid} />
                                </div>

                                <div className="bg-gray-800 rounded-lg p-6">
                                    <h2 className="text-2xl font-bold mb-4">Badge Completion Progress</h2>
                                    <p className="text-sm text-gray-400 mb-6">
                                        Calculated against {badgeStats.totalPaid} paid chapter members
                                    </p>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                        <BadgeCard 
                                            title="First Event" 
                                            count={badgeStats.firstEvent?.count}
                                            total={badgeStats.totalPaid}
                                            percent={badgeStats.firstEvent?.percent}
                                        />
                                        <BadgeCard 
                                            title="Social Butterfly" 
                                            count={badgeStats.socialButterfly?.count}
                                            total={badgeStats.totalPaid}
                                            percent={badgeStats.socialButterfly?.percent}
                                        />
                                        <BadgeCard 
                                            title="Academic Ace" 
                                            count={badgeStats.academicAce?.count}
                                            total={badgeStats.totalPaid}
                                            percent={badgeStats.academicAce?.percent}
                                        />
                                        <BadgeCard 
                                            title="GBM Warrior" 
                                            count={badgeStats.gbmWarrior?.count}
                                            total={badgeStats.totalPaid}
                                            percent={badgeStats.gbmWarrior?.percent}
                                        />
                                        <BadgeCard 
                                            title="Community Champion" 
                                            count={badgeStats.communityChampion?.count}
                                            total={badgeStats.totalPaid}
                                            percent={badgeStats.communityChampion?.percent}
                                        />
                                        <BadgeCard 
                                            title="PD Pro" 
                                            count={badgeStats.pdPro?.count}
                                            total={badgeStats.totalPaid}
                                            percent={badgeStats.pdPro?.percent}
                                        />
                                        <BadgeCard 
                                            title="Dedicated" 
                                            count={badgeStats.dedicated?.count}
                                            total={badgeStats.totalPaid}
                                            percent={badgeStats.dedicated?.percent}
                                        />
                                        <BadgeCard 
                                            title="Superstar" 
                                            count={badgeStats.superstar?.count}
                                            total={badgeStats.totalPaid}
                                            percent={badgeStats.superstar?.percent}
                                        />
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Members Tab */}
                        {activeTab === 'members' && (
                            <div className="bg-gray-800 rounded-lg p-6">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-2xl font-bold">All Members ({members.length})</h2>
                                    <button 
                                        onClick={() => exportMembersCSV(members)}
                                        className="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg"
                                    >
                                        Export CSV
                                    </button>
                                </div>
                                <div className="overflow-x-auto max-h-[600px] overflow-y-auto">
                                    <table className="data-table">
                                        <thead>
                                            <tr>
                                                <th>Name</th>
                                                <th>Email</th>
                                                <th>Paid Status</th>
                                                <th>Events</th>
                                                <th>Points</th>
                                                <th>Tier</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {members.map((member, idx) => (
                                                <tr key={idx} className={member.isPaidChapter ? 'bg-green-900 bg-opacity-20' : ''}>
                                                    <td>{member.displayName || member.name}</td>
                                                    <td className="text-sm text-gray-400">{member.email}</td>
                                                    <td>
                                                        <span className={`px-2 py-1 rounded text-xs ${
                                                            member.isPaidChapter 
                                                                ? 'bg-green-600 text-white' 
                                                                : 'bg-gray-600 text-gray-300'
                                                        }`}>
                                                            {member.isPaidChapter ? 'Paid' : 'Unpaid'}
                                                        </span>
                                                    </td>
                                                    <td>{member.eventCount || 0}</td>
                                                    <td>{member.totalPoints || 0}</td>
                                                    <td>{member.tier || 'Participant'}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* Badges Tab */}
                        {activeTab === 'badges' && (
                            <div className="bg-gray-800 rounded-lg p-6">
                                <h2 className="text-2xl font-bold mb-4">Badge Progress Details</h2>
                                <p className="text-sm text-gray-400 mb-6">
                                    Tracking against {badgeStats.totalPaid} paid chapter members
                                </p>
                                <div className="space-y-4">
                                    <BadgeProgressBar 
                                        title="First Event" 
                                        description="Attended at least 1 event"
                                        count={badgeStats.firstEvent?.count}
                                        total={badgeStats.totalPaid}
                                        percent={badgeStats.firstEvent?.percent}
                                    />
                                    <BadgeProgressBar 
                                        title="Social Butterfly" 
                                        description="Attended 3+ social events"
                                        count={badgeStats.socialButterfly?.count}
                                        total={badgeStats.totalPaid}
                                        percent={badgeStats.socialButterfly?.percent}
                                    />
                                    <BadgeProgressBar 
                                        title="Academic Ace" 
                                        description="Attended 3+ academic events"
                                        count={badgeStats.academicAce?.count}
                                        total={badgeStats.totalPaid}
                                        percent={badgeStats.academicAce?.percent}
                                    />
                                    <BadgeProgressBar 
                                        title="GBM Warrior" 
                                        description="Attended 4+ GBMs"
                                        count={badgeStats.gbmWarrior?.count}
                                        total={badgeStats.totalPaid}
                                        percent={badgeStats.gbmWarrior?.percent}
                                    />
                                    <BadgeProgressBar 
                                        title="Community Champion" 
                                        description="Attended 2+ community service events"
                                        count={badgeStats.communityChampion?.count}
                                        total={badgeStats.totalPaid}
                                        percent={badgeStats.communityChampion?.percent}
                                    />
                                    <BadgeProgressBar 
                                        title="PD Pro" 
                                        description="Attended 3+ professional development events"
                                        count={badgeStats.pdPro?.count}
                                        total={badgeStats.totalPaid}
                                        percent={badgeStats.pdPro?.percent}
                                    />
                                    <BadgeProgressBar 
                                        title="Dedicated" 
                                        description="Attended 5+ events total"
                                        count={badgeStats.dedicated?.count}
                                        total={badgeStats.totalPaid}
                                        percent={badgeStats.dedicated?.percent}
                                    />
                                    <BadgeProgressBar 
                                        title="Superstar" 
                                        description="Attended 10+ events total"
                                        count={badgeStats.superstar?.count}
                                        total={badgeStats.totalPaid}
                                        percent={badgeStats.superstar?.percent}
                                    />
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function StatCard({ title, value, color = 'blue' }) {
            const colors = {
                blue: 'bg-blue-600',
                green: 'bg-green-600',
                purple: 'bg-purple-600',
                orange: 'bg-orange-600'
            };
            
            return (
                <div className={`${colors[color]} rounded-lg p-6`}>
                    <div className="text-sm font-medium text-white opacity-80">{title}</div>
                    <div className="text-3xl font-bold mt-2">{value}</div>
                </div>
            );
        }

        function BadgeCard({ title, count, total, percent }) {
            return (
                <div className="bg-gray-700 rounded-lg p-4">
                    <div className="text-sm font-medium text-gray-300 mb-2">{title}</div>
                    <div className="text-2xl font-bold">{count}/{total}</div>
                    <div className="text-sm text-green-400 mt-1">{percent}%</div>
                </div>
            );
        }

        function BadgeProgressBar({ title, description, count, total, percent }) {
            return (
                <div className="border-b border-gray-700 pb-4">
                    <div className="flex justify-between items-center mb-2">
                        <div>
                            <div className="font-medium">{title}</div>
                            <div className="text-sm text-gray-400">{description}</div>
                        </div>
                        <div className="text-right">
                            <div className="font-bold">{count}/{total}</div>
                            <div className="text-sm text-green-400">{percent}%</div>
                        </div>
                    </div>
                    <div className="w-full bg-gray-700 rounded-full h-2">
                        <div 
                            className="bg-green-500 h-2 rounded-full transition-all duration-300"
                            style={{ width: `${percent}%` }}
                        />
                    </div>
                </div>
            );
        }

        function exportMembersCSV(members) {
            const headers = ['Name', 'Email', 'Uniqname', 'Paid Status', 'Events', 'Tier'];
            const rows = members.map(m => [
                m.displayName || m.name,
                m.email,
                m.uniqname,
                m.isPaidChapter ? 'Paid' : 'Unpaid',
                m.eventCount || 0,
                m.tier || 'Participant'
            ]);
            
            const csv = [headers, ...rows].map(row => row.join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'nsbe-members.csv';
            a.click();
        }

        const root = ReactDOM.createRoot(document.getElementById('admin-dashboard'));
        root.render(<AdminDashboard />);
    </script>
</body>
</html>
