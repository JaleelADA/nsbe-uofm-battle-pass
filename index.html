<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NSBEUM Points</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="/favicon.ico?v=2" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #151b23;
        --panel-strong: #1d2633;
        --text: #f5f7fa;
        --muted: #9da7b5;
        --line: #2d3746;
        --gold: #ffd54a;
        --green: #23c483;
        --blue: #42a5f5;
        --red: #ff6b6b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      a {
        color: inherit;
      }

      button,
      input {
        font: inherit;
      }

      .app {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      .topbar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        padding: 24px 0;
        border-bottom: 1px solid var(--line);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--gold);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 4rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 1rem;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }

      .button.primary {
        border-color: #d6aa2b;
        background: var(--gold);
        color: #171300;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin: 24px 0;
      }

      .metric,
      .toolbar,
      .leaderboard {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .metric {
        padding: 16px;
      }

      .metric-label {
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .metric-value {
        margin: 0;
        font-size: 1.7rem;
        font-weight: 800;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px;
        margin-bottom: 16px;
      }

      .search {
        flex: 1;
        min-width: 200px;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0f141c;
        color: var(--text);
        padding: 0 14px;
      }

      .status {
        color: var(--muted);
        font-size: 0.9rem;
        white-space: nowrap;
      }

      .status.error {
        color: var(--red);
      }

      .leaderboard {
        overflow: hidden;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }

      th {
        background: var(--panel-strong);
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      .rank {
        width: 72px;
        color: var(--gold);
        font-weight: 800;
      }

      .points {
        color: var(--gold);
        font-weight: 800;
      }

      .member-main {
        font-weight: 800;
      }

      .member-sub {
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.86rem;
      }

      .tier {
        display: inline-flex;
        min-width: 96px;
        justify-content: center;
        padding: 5px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 800;
      }

      .tier.gold {
        border-color: #d6aa2b;
        color: var(--gold);
      }

      .tier.silver {
        border-color: #b8c0cc;
        color: #dce3ed;
      }

      .tier.bronze {
        border-color: #c58a42;
        color: #f0b36b;
      }

      .tier.participant {
        border-color: #3b78b8;
        color: #8fc7ff;
      }

      .empty {
        padding: 44px 16px;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 760px) {
        .app {
          width: min(100% - 20px, 1120px);
          padding-top: 18px;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .actions {
          width: 100%;
          justify-content: stretch;
        }

        .actions .button {
          flex: 1;
        }

        .summary {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .toolbar {
          align-items: stretch;
          flex-direction: column;
        }

        .status {
          white-space: normal;
        }

        th:nth-child(4),
        td:nth-child(4) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./src/AppConfig.js"></script>
    <script src="./src/SimpleLeaderboard.js"></script>
  </body>
</html>
